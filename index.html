<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Razian</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0620">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0620;--a:#9b7bff;--b:#ffd36e;--mut:#b6abd9;--glass:#ffffff14;--line:#ffffff24;--bad:#ff6b8a;--ok:#2fc58f}
body[data-t="2"]{--bg:#04140e;--a:#3be8b0;--b:#ffe27a;--mut:#9fcfbe}
body[data-t="3"]{--bg:#150716;--a:#ff7ab6;--b:#ffb86b;--mut:#d9a9c9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:#fff;font-family:Vazirmatn,Tahoma,sans-serif;padding-bottom:110px;overflow-x:hidden;transition:background .6s}
#sky{position:fixed;inset:0;z-index:-2;background:radial-gradient(600px 400px at 20% 0,color-mix(in srgb,var(--a) 35%,transparent),transparent),radial-gradient(500px 400px at 100% 40%,color-mix(in srgb,var(--b) 14%,transparent),transparent),radial-gradient(2px 2px at 20px 30px,#fff,transparent),radial-gradient(2px 2px at 90px 120px,#fff9,transparent),radial-gradient(1.5px 1.5px at 160px 60px,#fff,transparent),radial-gradient(1.5px 1.5px at 230px 190px,#fff8,transparent);background-size:auto,auto,260px 240px,260px 240px,260px 240px,260px 240px;animation:tw 4s ease-in-out infinite alternate}
@keyframes tw{to{filter:brightness(1.25)}}
.ff{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.ff i{position:absolute;bottom:-10px;width:6px;height:6px;border-radius:50%;background:var(--b);box-shadow:0 0 12px 3px var(--b);animation:fly linear infinite;opacity:0}
@keyframes fly{10%{opacity:.9}100%{transform:translate(40px,-105vh);opacity:0}}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(14px);padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
.logo{font-size:23px;font-weight:800;direction:ltr;background:linear-gradient(100deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.chips{display:flex;gap:6px}
.chp{background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:5px 8px;font-weight:800;font-size:13px}
.mas{font-size:56px;animation:fl 3s ease-in-out infinite;display:inline-block;filter:drop-shadow(0 0 14px var(--a))}
@keyframes fl{50%{transform:translateY(-8px) rotate(4deg)}}
.hero{margin:14px 16px;background:linear-gradient(135deg,color-mix(in srgb,var(--a) 30%,transparent),var(--glass));border:1px solid var(--line);border-radius:22px;padding:14px;display:flex;align-items:center;gap:12px}
.bub{flex:1;background:#ffffff1c;border-radius:16px;padding:10px 12px;font-size:13px;line-height:1.9}
.goal{margin:0 16px;background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:12px 14px;font-size:13px}
.bar{height:10px;border-radius:10px;background:#ffffff1c;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(100deg,var(--a),var(--b));transition:width .4s}
.card{margin:14px 16px;background:var(--glass);border:1px solid var(--line);border-radius:20px;padding:16px;text-align:center;line-height:1.9}
.big{display:block;width:100%;margin:8px 0;background:linear-gradient(100deg,var(--a),var(--b));color:#150a30;border:0;font-family:inherit;font-weight:800;font-size:16px;padding:14px;border-radius:18px;box-shadow:0 5px 0 #0005}
.big.g{background:var(--glass);color:#fff;border:1px solid var(--line);box-shadow:none}
.lvl{margin:28px 16px 6px;text-align:center;font-weight:800;color:var(--b);font-size:16px;display:flex;align-items:center;gap:10px}
.lvl:before,.lvl:after{content:"";flex:1;height:1px;background:var(--line)}
.node{display:flex;flex-direction:column;align-items:center;margin:16px 0}
.nb{width:90px;height:90px;border-radius:50%;border:0;padding:7px;background:conic-gradient(var(--a) var(--p),#ffffff26 0);box-shadow:0 8px 0 #0006,0 0 24px color-mix(in srgb,var(--a) 40%,transparent);animation:fl 4s ease-in-out infinite}
.nb span{display:flex;align-items:center;justify-content:center;width:100%;height:100%;border-radius:50%;background:#1a1040;font-size:36px}
.nb.gr{background:conic-gradient(var(--b) var(--p),#ffffff26 0);box-shadow:0 8px 0 #0006,0 0 24px color-mix(in srgb,var(--b) 50%,transparent)}
.nb.lk{filter:grayscale(1);opacity:.45;animation:none}
.nb.dn span{background:color-mix(in srgb,var(--a) 40%,#1a1040)}
.nt{margin-top:8px;font-size:13px;font-weight:500}
.view{display:none}.view.on{display:block}
.row2{display:flex;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--line);font-size:14px}
.row2 b{direction:ltr;color:var(--a)}
.st3{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 16px}
.st3 div{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:14px;text-align:center;color:var(--mut);font-size:12px}
.st3 b{display:block;font-size:24px;color:var(--b)}
nav{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);right:16px;left:16px;height:66px;border-radius:24px;background:#120a2cf2;border:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;z-index:20}
nav div{text-align:center;font-size:11px;color:var(--mut);padding:8px 14px;border-radius:16px}
nav div.on{background:color-mix(in srgb,var(--a) 25%,transparent);color:#fff}
nav em{display:block;font-style:normal;font-size:21px}
#L{display:none;position:fixed;inset:0;z-index:50;background:var(--bg);flex-direction:column}
.lt{display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 8px}
.lt .bar{flex:1;margin:0}
.x{background:none;border:0;color:var(--mut);font-size:22px}
.lb{flex:1;overflow-y:auto;padding:10px 20px}
.pr{color:var(--mut);font-size:15px;margin:14px 0}
.bw{font-size:34px;font-weight:800;text-align:center;margin:18px 0;direction:ltr;color:var(--b)}
.bw.fa{direction:rtl;color:#fff}
.bw.sn{font-size:24px;line-height:1.8}.bw.sn u{color:var(--a);text-decoration:none;border-bottom:3px dashed var(--a)}
.sp{background:var(--glass);border:1px solid var(--line);color:#fff;border-radius:50%;width:48px;height:48px;font-size:20px}
.opt{display:block;width:100%;margin:10px 0;padding:15px;border-radius:16px;background:var(--glass);border:2px solid var(--line);color:#fff;font-family:inherit;font-size:17px}
.opt.en{direction:ltr}
.opt.ok{background:var(--ok);border-color:var(--ok)}.opt.no{background:var(--bad);border-color:var(--bad)}
.opt.sel{border-color:var(--b)}.opt:disabled{opacity:.5}
.opt.shake{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.inp{width:100%;padding:15px;border-radius:16px;background:var(--glass);border:2px solid var(--line);color:#fff;font-size:20px;direction:ltr;outline:none;font-family:inherit}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lf{padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 16px)}
.fb{border-radius:18px;padding:12px 14px;animation:pop .3s}
@keyframes pop{from{transform:scale(.9);opacity:0}}
.fb.g{background:#2fc58f33}.fb.b{background:#ff6b8a33}
.fb b{display:block;margin-bottom:6px}
.res{text-align:center;padding:30px 10px;line-height:2.2}
.res h1{font-size:70px;margin:0;animation:fl 2s infinite}
.note{background:var(--glass);border:1px solid var(--line);border-radius:20px;padding:14px 16px;line-height:2;font-size:15px}
.note h3{color:var(--b);margin:0 0 6px}
.note p{margin:6px 0}.note b{color:var(--a);direction:ltr;display:inline-block}
.ba{min-height:60px;border-bottom:2px dashed var(--line);margin:12px 0;display:flex;flex-wrap:wrap;gap:8px;direction:ltr;padding-bottom:8px}
.bc{display:flex;flex-wrap:wrap;gap:8px;direction:ltr;justify-content:center;margin-top:18px}
.ch{background:var(--glass);border:2px solid var(--line);color:#fff;border-radius:14px;padding:10px 14px;font-size:17px;font-family:inherit}
.ch:disabled{opacity:.2}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#000c;padding:10px 18px;border-radius:14px;font-size:14px;z-index:60;display:none}
.pt{position:fixed;z-index:70;font-size:24px;pointer-events:none;animation:ptf 1s ease-out forwards}
@keyframes ptf{to{transform:translate(var(--dx),var(--dy)) rotate(360deg);opacity:0}}
</style>
</head>
<body data-t="1">
<div id="sky"></div><div class="ff" id="ff"></div>

<div class="top">
  <div class="logo">Razian</div>
  <div class="chips"><div class="chp">🔥 <span id="tS">0</span></div><div class="chp">⭐ <span id="tX">0</span></div><div class="chp">💎 <span id="tG">0</span></div><div class="chp">❤️ <span id="tH">5</span></div></div>
</div>

<div class="view on" id="v0">
  <div class="hero"><div class="mas">🦉</div><div class="bub" id="bub"></div></div>
  <div class="goal"><div style="display:flex;justify-content:space-between"><span>هدف امروز</span><span id="gT"></span></div><div class="bar"><i id="gB" style="width:0"></i></div></div>
  <div id="ban"></div>
  <div id="path"></div>
</div>

<div class="view" id="v1">
  <div class="card"><div class="mas">🏋️</div><br><b style="font-size:18px">میدان تمرین</b><br><span style="color:var(--mut);font-size:13px">لغت‌هایی که بلدی رو محکم کن</span></div>
  <div style="margin:0 16px">
    <button class="big" onclick="prac('wrong')">🔁 مرور اشتباه‌ها (<span id="nW">0</span>)</button>
    <button class="big g" onclick="prac('rand')">🎲 تمرین تصادفی</button>
    <button class="big g" onclick="prac('listen')">🎧 تمرین شنیداری</button>
    <button class="big g" onclick="prac('type')">⌨️ تمرین نوشتاری</button>
  </div>
</div>

<div class="view" id="v2">
  <div class="card"><div class="mas">🧙‍♂️</div><br><b style="font-size:20px" id="pT"></b><br><span style="color:var(--mut);font-size:13px">سطح <span id="pL">1</span> · <span id="pLn"></span></span></div>
  <div class="st3"><div><b id="pS">0</b>روز پیاپی</div><div><b id="pX">0</b>امتیاز</div><div><b id="pK">0</b>لغت یادگرفته</div><div><b id="pU">0</b>ماجراجویی تمام‌شده</div></div>
  <div class="lvl">دفترچه جادو</div>
  <div id="pList"></div>
  <div style="margin:20px 16px"><button class="big g" onclick="if(confirm('همه پیشرفتت پاک می‌شه. مطمئنی؟')){localStorage.removeItem('rr_s');location.reload()}">🗑 شروع دوباره از صفر</button></div>
</div>

<nav>
  <div id="n0" class="on" onclick="tab(0)"><em>🗺️</em>ماجراجویی</div>
  <div id="n1" onclick="tab(1)"><em>🏋️</em>تمرین</div>
  <div id="n2" onclick="tab(2)"><em>🧙‍♂️</em>پروفایل</div>
  <div onclick="cyc()"><em>🎨</em>تم</div>
</nav>

<div id="L"></div>
<div class="toast" id="ts"></div>

<script src="data.js"></script>
<script>
const $=id=>document.getElementById(id);
const sh=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const pk=a=>a[Math.floor(Math.random()*a.length)];
const key=d=>d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
const tdy=()=>key(new Date());
const TIT=["شاگرد جادو","جادوگر کوچک","ساحر جوان","ساحر بزرگ","استاد افسون","جادوگر اعظم"];
const GOOD=["آفرین! جغد داره پر می‌زنه از خوشحالی 🦉","دمت گرم! حتی اژدها هم کف زد 🐉","عالی! تو قراره یه ساحر بزرگ بشی ✨","همینه! این کلمه رو دیگه از دست نمی‌دی 🔮","وای! انگار تو از بچگی انگلیسی خوندی 😎","درسته! یه سکه‌ی طلایی تو جیب جغد 🪙"];
const BAD=["اشکال نداره! حتی جادوگرها هم اشتباه می‌کنن 🧙","اوپس! جغد یه لحظه چشماش رو بست 🙈","نزدیک بود! دفعه بعد حتماً 💪","اشتباه یعنی داری یاد می‌گیری 🌱","اژدها خندید، ولی نگران نباش 🐲","ایول به شجاعتت! ولی جواب این نبود 😅"];
const TIPS=["سلام ساحر! امروز چند تا کلمه‌ی جادویی یاد بگیریم؟ 🦉","می‌دونستی؟ هر روز ۵ دقیقه از یه ماه ۳ ساعته‌ی یکجا بهتره!","من جغدم، ولی انگلیسی‌ام از خیلی آدم‌ها بهتره 😏","اگه استریکت بشکنه، اژدها خوشحال می‌شه! نذار بشکنه 🐉","کلمه‌ها رو بلند بگو؛ جادو فقط وقتی کار می‌کنه که صدا داشته باشه 🔊"];

const WD=[];UNITS.forEach((u,i)=>{if(u.words)u.words.forEach(w=>WD.push({en:w[0],fa:w[1],u:i}))});
const byEn=e=>WD.find(w=>w.en===e);

let S;try{S=JSON.parse(localStorage.getItem("rr_s"))}catch(e){}
S=Object.assign({xp:0,gems:0,streak:0,last:"",hearts:5,hAt:0,start:-1,prog:{},known:{},wrong:[],dxp:{}},S||{});
const save=()=>{try{localStorage.setItem("rr_s",JSON.stringify(S))}catch(e){}};
let th="1";try{th=localStorage.getItem("rr_t")||"1"}catch(e){}
document.body.dataset.t=th;
function cyc(){th=String(th%3+1);document.body.dataset.t=th;try{localStorage.setItem("rr_t",th)}catch(e){}}
function toast(t){const e=$("ts");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",1800)}
for(let i=0;i<16;i++){const s=document.createElement("i");s.style.left=Math.random()*100+"%";s.style.animationDuration=(8+Math.random()*10)+"s";s.style.animationDelay=(Math.random()*8)+"s";$("ff").appendChild(s)}

let AC;
function beep(ok){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);o.frequency.value=ok?740:190;g.gain.value=.08;o.start();o.stop(AC.currentTime+(ok?.12:.25))}catch(e){}}
function sp(t){try{const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function boom(em){for(let i=0;i<14;i++){const p=document.createElement("span");p.className="pt";p.textContent=pk(em);p.style.left="50%";p.style.top="45%";p.style.setProperty("--dx",(Math.random()*300-150)+"px");p.style.setProperty("--dy",(Math.random()*-260-30)+"px");document.body.appendChild(p);setTimeout(()=>p.remove(),1000)}}

function hearts(){if(S.hearts<5&&S.hAt){const n=Math.floor((Date.now()-S.hAt)/600000);if(n>0){S.hearts=Math.min(5,S.hearts+n);S.hAt=S.hearts>=5?0:S.hAt+n*600000;save()}}return S.hearts}
function lose(){hearts();if(S.hearts>=5)S.hAt=Date.now();S.hearts=Math.max(0,S.hearts-1);save();const h=$("lh");if(h)h.textContent="❤️ "+S.hearts}
function touch(x){const t=tdy();S.xp+=x;S.dxp[t]=(S.dxp[t]||0)+x;if(S.last!==t){const y=new Date();y.setDate(y.getDate()-1);S.streak=S.last===key(y)?S.streak+1:1;S.last=t}save()}

const pr=i=>i<S.start?3:(S.prog[i]||0);
const opn=i=>i===0||i<=S.start||pr(i-1)>=3;
function home(){
  hearts();
  const y=new Date();y.setDate(y.getDate()-1);
  if(S.last&&S.last!==tdy()&&S.last!==key(y)){S.streak=0}
  $("tS").textContent=S.streak;$("tX").textContent=S.xp;$("tG").textContent=S.gems;$("tH").textContent=S.hearts;
  $("bub").textContent=pk(TIPS);
  const g=Math.min(30,S.dxp[tdy()]||0);$("gT").textContent=g+" / 30 XP";$("gB").style.width=(g/30*100)+"%";
  $("ban").innerHTML=S.start<0?`<div class="card"><b style="font-size:18px">از کدوم سرزمین شروع کنیم؟</b><br><span style="color:var(--mut);font-size:13px">با یه آزمون ۱۰ سؤالی، جغد سطحت رو می‌فهمه</span><button class="big" onclick="placement()">🎯 آزمون تعیین سطح</button><button class="big g" onclick="S.start=0;save();home()">🌱 شروع از صفر</button></div>`:"";
  const off=[0,42,62,42,0,-42,-62,-42];let h="";
  UNITS.forEach((u,i)=>{
    if(i%5===0)h+=`<div class="lvl">${WORLDS[i/5]||"🌟 سرزمین ناشناخته"}</div>`;
    const p=pr(i),o=opn(i);
    h+=`<div class="node" style="transform:translateX(${off[i%8]}px)"><button class="nb ${u.g?"gr":""} ${o?"":"lk"} ${p>=3?"dn":""}" style="--p:${p/3*360}deg" onclick="openU(${i})"><span>${o?(p>=3?"✅":u.e):"🔒"}</span></button><div class="nt">${u.n}</div></div>`;
  });
  $("path").innerHTML=h;
}
function tab(n){
  document.querySelectorAll(".view").forEach((v,i)=>v.classList.toggle("on",i===n));
  [0,1,2].forEach(i=>$("n"+i).classList.toggle("on",i===n));
  if(n===0)home();
  if(n===1)$("nW").textContent=S.wrong.length;
  if(n===2)prof();
}
function prof(){
  const k=Object.keys(S.known),L=Math.floor(S.xp/100)+1;
  $("pT").textContent=TIT[Math.min(TIT.length-1,L-1)];
  $("pL").textContent=L;$("pLn").textContent=(100-S.xp%100)+" امتیاز تا سطح بعد";
  $("pS").textContent=S.streak;$("pX").textContent=S.xp;$("pK").textContent=k.length;
  $("pU").textContent=UNITS.filter((_,i)=>pr(i)>=3).length;
  $("pList").innerHTML=k.length?k.map(e=>{const w=byEn(e);return w?`<div class="row2"><b>${w.en}</b><span>${w.fa}</span></div>`:""}).join(""):`<div class="card" style="color:var(--mut)">هنوز لغتی یاد نگرفتی. اولین ماجراجویی رو شروع کن!</div>`;
}

const TY=[0,2,1,3];
function openU(i){
  if(!opn(i)){toast("اول سرزمین قبلی رو فتح کن 🔒");return}
  if(hearts()<=0){fail();return}
  const no=pr(i),u=UNITS[i];
  if(u.g){
    const f=sh(u.g.q).map(x=>({t:5,f:x})),b=sh(u.g.bs).map(x=>({t:6,b:x}));
    const qs=sh([...f.slice(0,4),...b.slice(0,2)]);
    run({mode:"lesson",unit:i,no,qs,note:u.g});
  }else{
    const ws=sh(WD.filter(w=>w.u===i));
    const qs=ws.map((w,k)=>({t:TY[(k+no)%4],w}));
    qs.splice(4,0,{t:4,ws:ws.slice(0,4)});
    run({mode:"lesson",unit:i,no,qs});
  }
}
function placement(){
  const pw=(a,b,n)=>sh(WD.filter(w=>Math.floor(w.u/5)>=a&&Math.floor(w.u/5)<=b)).slice(0,n);
  const ws=[...pw(0,0,3),...pw(1,1,3),...pw(2,3,4)];
  run({mode:"test",qs:ws.map((w,k)=>({t:[0,1,2][k%3],w}))});
}
function prac(kind){
  let ws;
  if(kind==="wrong"){ws=S.wrong.map(byEn).filter(Boolean).slice(0,8);if(!ws.length){toast("اشتباهی نداری 👏");return}}
  else{const k=Object.keys(S.known).map(byEn).filter(Boolean);ws=sh(k.length>=4?k:WD).slice(0,8)}
  const ty=kind==="listen"?[2]:kind==="type"?[3]:[0,1,2,3];
  run({mode:"prac",qs:ws.map((w,k)=>({t:ty[k%ty.length],w}))});
}

let R;
function run(o){R=Object.assign({i:0,ok:0,mis:0,lock:0},o);R.n=R.qs.length;$("L").style.display="flex";R.note?noteScr():show()}
function quit(){$("L").style.display="none";home()}
function shell(inner){
  const pct=Math.min(100,R.i/R.n*100);
  $("L").innerHTML=`<div class="lt"><button class="x" onclick="quit()">✕</button><div class="bar"><i style="width:${pct}%"></i></div><span id="lh">${R.mode==="test"?"🎯":"❤️ "+S.hearts}</span></div><div class="lb">${inner}</div><div class="lf" id="lf"></div>`;
}
function noteScr(){

function opts(q,fa){
  const w=q.w;
  const pool=sh(WD.filter(x=>x.en!==w.en));
  const same=pool.filter(x=>x.u===w.u).concat(pool.filter(x=>x.u!==w.u));
  const d=same.slice(0,3).map(x=>fa?x.fa:x.en);
  R.ans=fa?w.fa:w.en;R.opts=sh([R.ans,...d]);
  return R.opts.map((o,k)=>`<button class="opt ${fa?"":"en"}" onclick="pick(${k})">${o}</button>`).join("");
