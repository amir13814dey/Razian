<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1220" />
  <title>قیمت لحظه‌ای بازار</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    :root {
      --bg: #0b1220;
      --card: #111c31;
      --border: #1f2d45;
      --text: #e6edf7;
      --muted: #8ba0bd;
      --green: #22c55e;
      --red: #ef4444;
      --gold: #f5c542;
      --oil: #64748b;
      --fx: #38bdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', Tahoma, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; padding: 16px; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 8px 4px 20px; }
    h1 { font-size: 1.1rem; font-weight: 700; letter-spacing: -.3px; }
    #status { font-size: .7rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
    #status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
    #status.live .dot { background: var(--green); box-shadow: 0 0 8px var(--green); animation: pulse 1.8s infinite; }
    @keyframes pulse { 50% { opacity: .35; } }

    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 14px;
      position: relative; overflow: hidden; transition: border-color .2s;
    }
    .card:hover { border-color: #2e425f; }
    .card .tag { font-size: .62rem; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; margin-bottom: 6px; display: block; }
    .card .name { font-size: .82rem; font-weight: 600; margin-bottom: 8px; }
    .card .price { font-size: 1.18rem; font-weight: 800; font-variant-numeric: tabular-nums; direction: ltr; text-align: right; }
    .card .meta { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; font-size: .68rem; }
    .card .change { font-weight: 700; direction: ltr; }
    .up { color: var(--green); }
    .down { color: var(--red); }
    .flat { color: var(--muted); }
    .card .time { color: var(--muted); direction: ltr; font-size: .6rem; }
    .card::after { content: ''; position: absolute; inset: auto 0 0 0; height: 3px; background: var(--accent, #334155); opacity: .5; }
    .gold { --accent: var(--gold); }
    .oil { --accent: var(--oil); }
    .fx { --accent: var(--fx); }
    .ir { --accent: #a78bfa; }

    .toolbar { display: flex; gap: 8px; margin: 16px 0; }
    button {
      flex: 1; padding: 11px; border-radius: 12px; border: 1px solid var(--border);
      background: var(--card); color: var(--text); font-weight: 600; font-size: .8rem; cursor: pointer;
    }
    button:active { transform: scale(.985); }
    #lastUpdate { text-align: center; font-size: .65rem; color: var(--muted); margin-top: 14px; }
  </style>
</head>
<body>
  <header>
    <h1>📊 بازار لحظه‌ای</h1>
    <div id="status"><span class="dot"></span><span id="statusText">در حال اتصال…</span></div>
  </header>

  <main class="grid" id="grid"></main>

  <div class="toolbar">
    <button id="refreshBtn">⟳ به‌روزرسانی دستی</button>
  </div>
  <p id="lastUpdate">—</p>

  <script>
    // ---------- Config ----------
    const BIQUOTE = 'https://biquote.io/api/latest';
    const GOLD_API = 'https://api.gold-api.com/price/XAU';
    const IRAN_API = 'https://nerkh.jahankhahan.shop/data/live.json';

    // دارایی‌های نمایش‌داده‌شده (نمادها را می‌توانی کم/زیاد کنی)
    const BIQUOTE_SYMBOLS = [
      { symbol: 'XAUUSD', label: 'طلا (اونس جهانی)', unit: '$', kind: 'gold', tag: 'Gold' },
      { symbol: 'WTIUSD',  label: 'نفت WTI',          unit: '$', kind: 'oil',  tag: 'Oil'  },
      { symbol: 'EURUSD',  label: 'یورو / دلار',      unit: '',  kind: 'fx',   tag: 'FX'   },
      { symbol: 'GBPUSD',  label: 'پوند / دلار',      unit: '',  kind: 'fx',   tag: 'FX'   },
      { symbol: 'USDJPY',  label: 'دلار / ین',        unit: '¥', kind: 'fx',   tag: 'FX'   },
    ];

    // ---------- State ----------
    const state = new Map();
    const grid = document.getElementById('grid');
    const statusEl = document.getElementById('status');
    const statusText = document.getElementById('statusText');
    const lastUpdateEl = document.getElementById('lastUpdate');

    // ---------- Helpers ----------
    const fmt = (n, dec = 2) => Number(n).toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec });
    const fmtIran = (n) => Number(n).toLocaleString('fa-IR');

    function setStatus(live, text) {
      statusEl.classList.toggle('live', live);
      statusText.textContent = text;
    }

    function render() {
      grid.innerHTML = '';
      for (const item of state.values()) {
        const changeClass = item.change > 0 ? 'up' : item.change < 0 ? 'down' : 'flat';
        const changeText = item.change == null ? '—' : `${item.change > 0 ? '+' : ''}${item.change.toFixed(2)}%`;
        const priceText = item.kind === 'ir'
          ? fmtIran(item.price)
          : item.unit === '$'
            ? `$${fmt(item.price, item.symbol === 'USDJPY' ? 2 : 2)}`
            : fmt(item.price, 4);

        const card = document.createElement('div');
        card.className = `card ${item.kind}`;
        card.innerHTML = `
          <span class="tag">${item.tag}</span>
          <div class="name">${item.label}</div>
          <div class="price">${priceText}</div>
          <div class="meta">
            <span class="change ${changeClass}">${changeText}</span>
            <span class="time">${item.time || '—'}</span>
          </div>`;
        grid.appendChild(card);
      }
    }

    function upsert(key, data) {
      state.set(key, { ...state.get(key), ...data });
    }

    // ---------- Fetchers ----------
    async function fetchBiquote() {
      const symbols = BIQUOTE_SYMBOLS.map(s => s.symbol);
      const url = `${BIQUOTE}?${symbols.map(s => `symbols=${s}`).join('&')}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error(`biquote ${res.status}`);
      const json = await res.json();
      const list = Array.isArray(json) ? json : json.data || json.ticks || [];

      for (const raw of list) {
        const sym = raw.symbol || raw.Symbol;
        const conf = BIQUOTE_SYMBOLS.find(c => c.symbol === sym);
        if (!conf) continue;
        const price = raw.price ?? raw.mid ?? raw.last;
        const change = raw.changePercent ?? raw.change_percent ?? raw.changePct ?? null;
        const t = raw.timestamp || raw.updatedAt;
        upsert(sym, {
          ...conf,
          price,
          change: change != null ? Number(change) : null,
          time: t ? new Date(t).toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' }) : null,
        });
      }
    }

    async function fetchGoldFallback() {
      // فقط اگر biquote طلا را نداد، از gold-api.com استفاده کن
      if (state.has('XAUUSD') && state.get('XAUUSD').price) return;
      const res = await fetch(GOLD_API);
      if (!res.ok) throw new Error(`gold-api ${res.status}`);
      const j = await res.json();
      upsert('XAUUSD', {
        symbol: 'XAUUSD', label: 'طلا (اونس جهانی)', unit: '$', kind: 'gold', tag: 'Gold',
        price: j.price,
        change: null,
        time: j.updatedAt ? new Date(j.updatedAt).toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' }) : null,
      });
    }

    async function fetchIran() {
      const res = await fetch(IRAN_API);
      if (!res.ok) throw new Error(`iran ${res.status}`);
      const j = await res.json();
      const r = j.rates || {};
      const c = j.change || {};
      const t = j.time || null;

      const map = [
        ['dollar', 'دلار آمریکا', 'IR-USD'],
        ['gold',   'طلای ۱۸ عیار', 'IR-GOLD'],
        ['emami',  'سکه امامی',     'IR-COIN'],
      ];
      for (const [key, label, id] of map) {
        if (r[key] == null) continue;
        upsert(id, {
          symbol: id, label, unit: 'تومان', kind: 'ir', tag: 'Iran',
          price: r[key],
          change: c[key] != null ? Number(c[key]) : null,
          time: t || null,
        });
      }
    }

    // ---------- Orchestrator ----------
    async function refreshAll() {
      setStatus(false, 'در حال دریافت…');
      const results = await Promise.allSettled([
        fetchBiquote(),
        fetchIran(),
      ]);
      // fallback طلا
      try { await fetchGoldFallback(); } catch (_) {}

      const ok = results.filter(r => r.status === 'fulfilled').length;
      setStatus(ok > 0, ok > 0 ? 'زنده' : 'خطا در اتصال');
      lastUpdateEl.textContent = `آخرین تلاش: ${new Date().toLocaleTimeString('fa-IR')}`;
      render();
    }

    // ---------- Boot ----------
    document.getElementById('refreshBtn').addEventListener('click', refreshAll);

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }

    refreshAll();
    setInterval(refreshAll, 10000); // هر ۱۰ ثانیه
  </script>
</body>
</html>
