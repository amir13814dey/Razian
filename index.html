<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Razian Quiz Hub - بازی آنلاین و معما</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#030407">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg-main: #030407;
  --card-bg: rgba(255, 255, 255, 0.03);
  --accent-neon: #6366f1; /* بنفش/آبی نئونی مدرن */
  --accent-glow: rgba(99, 102, 241, 0.35);
  --gold-neon: #ffb703;
  --success-color: #10b981;
  --error-color: #ef4444;
  --text-primary: #ffffff;
  --text-sub: #94a3b8;
  --glass-bg: rgba(15, 17, 26, 0.85);
  --glass-border: rgba(255, 255, 255, 0.08);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body {
  margin: 0; background: var(--bg-main); color: var(--text-primary);
  font-family: 'Vazirmatn', Tahoma, sans-serif; padding-bottom: 120px; overflow-x: hidden; user-select: none;
}

.aura-container { position: fixed; inset: 0; pointer-events: none; z-index: -1; overflow: hidden; }
.aura-1 { position: absolute; top: -100px; right: -50px; width: 350px; height: 350px; background: radial-gradient(circle, rgba(99, 102, 241, 0.2) 0%, transparent 70%); filter: blur(60px); }
.aura-2 { position: absolute; top: 40%; left: -100px; width: 400px; height: 400px; background: radial-gradient(circle, rgba(255, 183, 3, 0.15) 0%, transparent 70%); filter: blur(80px); }

header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 30;
  padding: calc(env(safe-area-inset-top, 0px) + 14px) 20px 12px;
  display: flex; justify-content: space-between; align-items: center;
  background: linear-gradient(180deg, rgba(3, 4, 7, 0.9) 0%, transparent 100%);
  backdrop-filter: blur(8px);
}
.brand { display: flex; align-items: center; gap: 8px; }
.brand-logo { font-size: 20px; font-weight: 900; letter-spacing: 1.5px; background: linear-gradient(135deg, #fff 30%, var(--accent-neon)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.brand-badge { font-size: 9px; font-weight: 800; background: var(--accent-neon); color: #fff; padding: 2px 6px; border-radius: 6px; }

.coin-box { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 800; color: var(--gold-neon); background: rgba(255, 183, 3, 0.1); padding: 6px 12px; border-radius: 20px; border: 1px solid rgba(255, 183, 3, 0.2); }

.container { padding: calc(env(safe-area-inset-top, 0px) + 80px) 20px 20px; max-width: 600px; margin: 0 auto; }

/* کارت بازی و معما */
.game-card { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 24px; padding: 24px; backdrop-filter: blur(16px); box-shadow: 0 20px 40px rgba(0,0,0,0.5); position: relative; overflow: hidden; }
.level-indicator { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--text-sub); font-weight: 700; margin-bottom: 16px; }
.level-badge { background: rgba(99, 102, 241, 0.15); color: var(--accent-neon); padding: 4px 10px; border-radius: 8px; border: 1px solid rgba(99, 102, 241, 0.3); }

.question-text { font-size: 18px; font-weight: 900; line-height: 1.6; margin-bottom: 24px; text-align: right; color: #fff; }

/* گزینه‌ها */
.options-grid { display: flex; flex-direction: column; gap: 12px; }
.option-btn { width: 100%; padding: 16px 20px; border-radius: 16px; background: var(--card-bg); border: 1px solid var(--glass-border); color: #fff; font-size: 14px; font-weight: 700; text-align: right; cursor: pointer; transition: all 0.2s; display: flex; justify-content: space-between; align-items: center; }
.option-btn:active { transform: scale(0.98); }
.option-btn.correct { background: rgba(16, 185, 129, 0.2); border-color: var(--success-color); color: var(--success-color); }
.option-btn.wrong { background: rgba(239, 68, 68, 0.2); border-color: var(--error-color); color: var(--error-color); }

/* نویگیشن پایین */
nav {
  position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); right: 20px; left: 20px; height: 68px; max-width: 600px; margin: 0 auto;
  border-radius: 26px; background: var(--glass-bg); border: 1px solid var(--glass-border); backdrop-filter: blur(25px);
  display: flex; justify-content: space-around; align-items: center; z-index: 30; box-shadow: 0 20px 40px rgba(0,0,0,0.9);
}
nav div { text-align: center; font-size: 10.5px; color: var(--text-sub); padding: 8px 16px; border-radius: 18px; transition: all 0.3s; font-weight: 700; cursor: pointer; }
nav div.on { background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(99, 102, 241, 0.05)); color: #fff; border: 1px solid rgba(99, 102, 241, 0.3); box-shadow: 0 0 15px var(--accent-glow); }
nav em { display: block; font-style: normal; font-size: 20px; margin-bottom: 2px; }

/* پنل‌های مختلف */
.panel { display: none; }
.panel.active { display: block; }

.leaderboard-item { display: flex; justify-content: space-between; align-items: center; background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 14px; padding: 14px 18px; margin-bottom: 10px; font-weight: 700; font-size: 13.5px; }
</style>
</head>
<body>

<div class="aura-container">
  <div class="aura-1"></div>
  <div class="aura-2"></div>
</div>

<header>
  <div class="brand">
    <span class="brand-logo">RAZIAN QUIZ</span>
    <span class="brand-badge">GAME</span>
  </div>
  <div class="coin-box">
    <span>🪙</span>
    <span id="coinCount">120</span>
  </div>
</header>

<div class="container">
  
  <!-- صفحه بازی اصلی -->
  <div class="panel active" id="pGame">
    <div class="game-card">
      <div class="level-indicator">
        <span class="level-badge" id="levelBadge">مرحله ۱ از ۵</span>
        <span style="color:var(--text-sub);">معمای هوش</span>
      </div>
      
      <div class="question-text" id="questionText">در حال بارگذاری معما...</div>
      
      <div class="options-grid" id="optionsContainer"></div>
    </div>
  </div>

  <!-- صفحه رتبه‌بندی / جوایز -->
  <div class="panel" id="pRank">
    <h3 style="font-size: 18px; font-weight: 900; margin-bottom: 16px;">🏆 برترین‌های هفته</h3>
    <div class="leaderboard-item">
      <span>🥇 امیرسجاد</span>
      <span style="color:var(--gold-neon);">2450 سکه</span>
    </div>
    <div class="leaderboard-item">
      <span>🥈 کوروش</span>
      <span style="color:var(--gold-neon);">1920 سکه</span>
    </div>
    <div class="leaderboard-item">
      <span>🥉 ملیکا</span>
      <span style="color:var(--gold-neon);">1650 سکه</span>
    </div>
  </div>

  <!-- صفحه درباره بازی -->
  <div class="panel" id="pAbout">
    <div class="game-card" style="text-align: center; line-height: 1.8;">
      <h3 style="font-size: 18px; font-weight: 900; margin-top: 0;">درباره بازی رازیان</h3>
      <p style="font-size: 13px; color: var(--text-sub);">چالش‌های روزانه اطلاعات عمومی، معماهای سخت و تست‌های هوش. امتیاز جمع کن و رتبه‌ات رو بالا ببر!</p>
    </div>
  </div>

</div>

<nav>
  <div id="n0" class="on" onclick="switchTab(0, 'pGame')"><em>🎮</em>بازی</div>
  <div id="n1" onclick="switchTab(1, 'pRank')"><em>🏆</em>رتبه‌بندی</div>
  <div id="n2" onclick="switchTab(2, 'pAbout')"><em>⭐</em>درباره</div>
</nav>

<script>
// دیتابیس سوالات و معماها
const quizData = [
  {
    q: "کدام سیاره در منظومه شمسی به نام سیاره سرخ شناخته می‌شود؟",
    options: ["مشتری", "مریخ", "زهره", "عطارد"],
    answer: 1
  },
  {
    q: "کدام زبان برنامه‌نویسی به عنوان زبان اصلی وب در سمت کاربر شناخته می‌شود؟",
    options: ["Python", "C++", "JavaScript", "Java"],
    answer: 2
  },
  {
    q: "کدام شهر پایتخت کشور ژاپن است؟",
    options: ["سئول", "پکن", "توکیو", "اوساکا"],
    answer: 2
  },
  {
    q: "بزرگترین اقیانوس کره زمین کدام است؟",
    options: ["اقیانوس آرام", "اقیانوس اطلس", "اقیانوس هند", "اقیانوس منجمد شمالی"],
    answer: 0
  },
  {
    q: "سرعت نور تقریباً چند کیلومتر بر ثانیه است؟",
    options: ["۱۵۰,۰۰۰", "۳۰۰,۰۰۰", "۴۵۰,۰۰۰", "۶۰۰,۰۰۰"],
    answer: 1
  }
];

let currentLevel = 0;
let score = 120;

function loadQuestion() {
  if (currentLevel >= quizData.length) {
    document.getElementById("pGame").innerHTML = `
      <div class="game-card" style="text-align:center; padding: 40px 20px;">
        <h2 style="font-size:22px; font-weight:900; color:var(--gold-neon); margin-bottom:10px;">🎉 تبریک! همه مراحل را تمام کردی</h2>
        <p style="color:var(--text-sub); font-size:13.5px; margin-bottom:20px;">تو توانستی با موفقیت تمام معماهای این بخش را حل کنی.</p>
        <button onclick="resetGame()" style="background:var(--accent-neon); color:#fff; border:0; padding:12px 24px; border-radius:14px; font-weight:800; cursor:pointer;">بازی مجدد</button>
      </div>
    `;
    return;
  }

  const qData = quizData[currentLevel];
  document.getElementById("levelBadge").textContent = `مرحله ${currentLevel + 1} از ${quizData.length}`;
  document.getElementById("questionText").textContent = qData.q;

  const optContainer = document.getElementById("optionsContainer");
  optContainer.innerHTML = qData.options.map((opt, index) => `
    <button class="option-btn" onclick="checkAnswer(${index}, this)">
      <span>${opt}</span>
      <span style="font-size:12px; opacity:0.6;">گزینه ${index + 1}</span>
    </button>
  `).join("");
}

function checkAnswer(selectedIndex, btnElement) {
  const qData = quizData[currentLevel];
  const allBtns = document.querySelectorAll(".option-btn");
  
  // غیرفعال کردن کلیک مجدد
  allBtns.forEach(b => b.style.pointerEvents = "none");

  if (selectedIndex === qData.answer) {
    btnElement.classList.add("correct");
    score += 20;
    document.getElementById("coinCount").textContent = score;
    setTimeout(() => {
      currentLevel++;
      loadQuestion();
    }, 1200);
  } else {
    btnElement.classList.add("wrong");
    allBtns[qData.answer].classList.add("correct");
    setTimeout(() => {
      currentLevel++;
      loadQuestion();
    }, 1500);
  }
}

function resetGame() {
  currentLevel = 0;
  score = 120;
  document.getElementById("coinCount").textContent = score;
  location.reload();
}

function switchTab(index, panelId) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById(panelId).classList.add('active');
  
  [0, 1, 2].forEach(i => document.getElementById("n" + i)?.classList.toggle("on", i === index));
  window.scrollTo({ top: 0, behavior: "smooth" });
}

loadQuestion();

if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>
</body>
</html>
